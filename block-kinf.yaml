# MHTGR-350 standard fuel element, fresh, 20 C: infinite lattice k-infinity and ISOTXS (XS ID AA),
# with explicit TRISO. block-kinf-homogenized.yaml smears the compacts instead.
settings:
  comment: MHTGR-350 standard element, infinite lattice, explicit TRISO
  loadingFile: mhtgr350-blueprints.yaml
  nCycles: 1
  burnSteps: 0
  power: 350000000.0
  genReports: false
  groupStructure: ANL33
  xsKernel: OpenMC
  xsBlockRepresentation: Median  # a real block: Average would smear the poison through the graphite
  openmcCrossSections: /mnt/storage/nuclear_data/openmc/endfb-viii.1-hdf5/cross_sections.xml
  openmcParticles: 20000
  openmcBatches: 150
  openmcInactiveBatches: 50
  openmcBlockModel: heterogeneous
  openmcParticleModel: explicit
  openmcPlotGeometry: true
  versions:
    armi: uncontrolled
